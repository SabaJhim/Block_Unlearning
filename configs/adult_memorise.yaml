# Adult in the MEMORISATION regime: high-capacity model on 8,000 training records.
# Standard adult.yaml generalises too well for erasure to be measurable (see README).
# Run `python scripts/prepare_data.py adult` first.
name: adult_memorise

data:
  kind: tabular
  path: data/adult.csv
  label_col: income
  positive_labels: [">50K"]
  test_frac: 0.2
  split_seed: 0
  subsample_train: 8000       # small train set + big model = measurable memorisation
  categorical: [workclass, occupation, sex, race, native-country, marital-status,
                relationship, education]
  log1p: [capital-gain, capital-loss, fnlwgt]
  active_party: employment
  parties:                   # order matters: this is party 0, 1, 2
    employment:  [workclass, occupation, hours-per-week, capital-gain, capital-loss]
    demographic: [age, sex, race, native-country, marital-status, relationship]
    education:   [education, education-num, fnlwgt]

model:
  emb_dim: 32
  bottom_hidden: [256, 256]
  top_hidden: [256, 256]
  null_token: mean

train:
  epochs: 100
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0
  block_dropout: 0.0

unlearning:
  delete_party: demographic
  n_delete: 400
  n_control: 400
  n_neighbors: 5

methods:
  blockedit: {steps: 300, lr: 0.001, lam: 1.0}
  row_ga: {epochs: 3, lr: 0.0005}
